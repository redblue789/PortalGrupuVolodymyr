{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
  <div class="modal-page" style="max-width:380px;">
    <h2>Вхід до порталу</h2>

    <div class="hint">
      Увійдіть, щоб керувати подіями (модератори й адміністратори).
    </div>

    <form method="post">
      {% csrf_token %}

      <div class="field">
        <label for="{{ form.username.id_for_label }}">Логін</label>
        {{ form.username }}
      </div>

      <div class="field">
        <label for="{{ form.password.id_for_label }}">Пароль</label>
        {{ form.password }}
      </div>

      {% if form.errors %}
        <div class="field-error">
          Неправильний логін або пароль.
        </div>
      {% endif %}

      <input type="hidden" name="next" value="{{ next }}">

      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">
          Увійти
        </button>
      </div>
    </form>
  </div>
{% endblock %}
