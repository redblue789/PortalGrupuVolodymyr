<!--
    ТИМЧАСОВА сторінка входу — використовує стандартний Django LoginView,
    щоб можна було тестувати Систему опитувань вже зараз.
    Коли буде готова власна "Система автентифікації" (Влад П.), цей файл
    та url 'login'/'logout' в PortalGroup/urls.py можна замінити.
-->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.375rem 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 400px;">
    <h1 class="mb-4">Вхід</h1>
    {% if form.errors %}
        <div class="alert alert-danger">Неправильний логін або пароль.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">{{ form.username.label }}</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label">{{ form.password.label }}</label>
            {{ form.password }}
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Увійти</button>
    </form>
    <p class="mt-3">
        <a href="{% url 'admin:index' %}">Немає акаунта? Створіть його через адмін-панель.</a>
    </p>
</div>
</body>
</html>
